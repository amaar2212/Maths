<!DOCTYPE html>
<html>
<head>
<title>Math Formula Hub</title>

<style>

body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#001133,#003366);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:white;
}

.container{
  width:320px;
  background:#0b1f3a;
  padding:30px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 0 25px rgba(0,191,255,0.5);
}

h1{
  margin-bottom:10px;
}

p{
  color:#ccc;
  margin-bottom:25px;
}

input{
  width:90%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-radius:10px;
  outline:none;
  font-size:16px;
}

button{
  width:100%;
  padding:12px;
  margin-top:15px;
  border:none;
  border-radius:30px;
  background:#00bfff;
  color:white;
  font-size:18px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#009acd;
  transform:scale(1.03);
}

.link{
  margin-top:20px;
  color:#00bfff;
  cursor:pointer;
}

#signup-box{
  display:none;
}

</style>
</head>

<body>

<!-- LOGIN BOX -->

<div class="container" id="login-box">

<h1>Math Formula Hub 🚀</h1>
<p>Login to continue</p>

<input type="email" placeholder="Enter Email">
<input type="password" placeholder="Enter Password">

<button>Login</button>

<button>Login with Google</button>

<div class="link" onclick="showSignup()">
Create New Account
</div>

</div>

<!-- SIGNUP BOX -->

<div class="container" id="signup-box">

<h1>Create Account ✨</h1>
<p>Signup to start learning</p>

<input type="text" placeholder="Full Name">
<input type="email" placeholder="Enter Email">
<input type="password" placeholder="Create Password">

<button>Signup</button>

<div class="link" onclick="showLogin()">
Already have account? Login
</div>

</div>

<script>

function showSignup(){
  document.getElementById("login-box").style.display="none";
  document.getElementById("signup-box").style.display="block";
}

function showLogin(){
  document.getElementById("signup-box").style.display="none";
  document.getElementById("login-box").style.display="block";
}

</script>

</body>
</html>
