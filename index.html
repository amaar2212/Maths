<!DOCTYPE html>
<html>
<head>
<title>Math Formula Hub</title>

<style>

body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#001133,#003366);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:white;
}

.container{
  width:320px;
  background:#0b1f3a;
  padding:30px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 0 25px rgba(0,191,255,0.5);
}

h1{
  margin-bottom:10px;
}

p{
  color:#ccc;
  margin-bottom:25px;
}

input{
  width:90%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-radius:10px;
  outline:none;
  font-size:16px;
}

button{
  width:100%;
  padding:12px;
  margin-top:15px;
  border:none;
  border-radius:30px;
  background:#00bfff;
  color:white;
  font-size:18px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#009acd;
  transform:scale(1.03);
}

.link{
  margin-top:20px;
  color:#00bfff;
  cursor:pointer;
}

#signup-box{
  display:none;
}

</style>
</head>
<body>

<h1 style="color:white; text-align:center; margin-top:100px;">
Math Formula Hub 🚀
</h1>

</body>

</html>
